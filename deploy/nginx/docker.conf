# ============================================================
# PAWLY — Docker 容器内 Nginx 配置
# 用于 Dockerfile 的多阶段构建，静态文件位于 /usr/share/nginx/html
# ============================================================

server {
    listen 80;

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    error_page 404 /404.html;

    location = /404.html {
        internal;
        expires -1;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    location /images/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location = /favicon.svg {
        expires 7d;
        access_log off;
    }

    location = /robots.txt {
        expires 1h;
        access_log off;
    }

    location = /sitemap-index.xml {
        expires 1h;
        access_log off;
    }

    location = /sitemap-0.xml {
        expires 1h;
        access_log off;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/json
        application/javascript
        text/javascript
        application/rss+xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
