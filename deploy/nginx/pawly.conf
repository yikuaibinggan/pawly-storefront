# ============================================================
# PAWLY 官网 — Nginx 静态站点配置
#
# 使用方式：
#   sudo cp deploy/nginx/pawly.conf /etc/nginx/sites-available/pawly.conf
#   sudo ln -s /etc/nginx/sites-available/pawly.conf /etc/nginx/sites-enabled/pawly.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 上线前替换：
#   - example.com / www.example.com
#   - /var/www/pawly/current（如果使用其他目录）
#
# HTTPS 由 Certbot 在此文件基础上自动补充。
# ============================================================

server {
    listen 80;

    server_name example.com www.example.com;

    root /var/www/pawly/current;
    index index.html;

    charset utf-8;
    server_tokens off;
    client_max_body_size 1m;

    access_log /var/log/nginx/pawly.access.log;
    error_log  /var/log/nginx/pawly.error.log warn;

    # Astro 的 404 页面是 /404.html
    error_page 404 /404.html;

    location = /404.html {
        internal;
        expires -1;
    }

    # HTML 不做长缓存，保证发布后立即生效
    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    # Astro 构建产物带内容哈希，可长期缓存
    location /_astro/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 产品图 / 场景图：未带哈希，使用 30 天缓存
    location /images/ {
        try_files $uri =404;
        expires 30d;
        access_log off;
    }

    location = /favicon.svg {
        expires 7d;
        access_log off;
    }

    location = /robots.txt {
        expires 1h;
        access_log off;
    }

    location = /sitemap-index.xml {
        expires 1h;
        access_log off;
    }

    location = /sitemap-0.xml {
        expires 1h;
        access_log off;
    }

    # 压缩
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/xml
        application/json
        application/javascript
        text/javascript
        application/rss+xml
        image/svg+xml;

    # 基础安全响应头
    # 注意：某个 location 内如果单独写了 add_header，会覆盖 server 级配置；
    #       /_astro/ 已单独补充必要的 nosniff。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 等 HTTPS 稳定后再启用 HSTS（不要在纯 HTTP 阶段启用）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
