name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # 项目站点默认值：https://<owner>.github.io/<repo>/
      # 自定义域名或 <owner>.github.io 用户站点，请在仓库变量中覆盖：
      #   SITE_URL=https://pawly.com
      #   BASE_PATH=/
      #   CNAME=pawly.com
      PUBLIC_SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io', github.repository_owner) }}
      PUBLIC_BASE_PATH: ${{ vars.BASE_PATH || (endsWith(github.event.repository.name, format('{0}.github.io', github.repository_owner)) && '/' || format('/{0}', github.event.repository.name)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure custom domain
        if: ${{ vars.CNAME != '' }}
        run: echo "${{ vars.CNAME }}" > public/CNAME

      - name: Type check
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Check built site
        run: pnpm check:site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
